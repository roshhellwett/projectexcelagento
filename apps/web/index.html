    <meta name="theme-color" content="#f8fafc" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Set the saved or preferred theme before the first paint, so the page never flashes
      // light for a dark-mode user. Keep this a plain inline script (ES5): modules are deferred.
      (function () {
        try {
          var stored = window.localStorage.getItem('excel_agent_theme');
          var prefersDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme =
            stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          if (theme === 'dark') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f172a');
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
